backend:
  name: git-gateway
  branch: main

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - file: "src/content/pages/home.md"
        label: "Home Page"
        name: "home"
        fields:
          - {label: "Hero Carousel", name: "carousel", widget: "list", fields: [{label: "Image", name: "image", widget: "image"}, {label: "Title", name: "title", widget: "string"}, {label: "Subtitle", name: "subtitle", widget: "string"}]}
          - {label: "Intro Title", name: "intro_title", widget: "string", default: "For Him & For Her"}
          - {label: "Intro Description", name: "intro_description", widget: "text"}
          - {label: "Features", name: "features", widget: "list", fields: [{label: "Title", name: "title", widget: "string"}, {label: "Description", name: "description", widget: "text"}, {label: "Icon (SVG code)", name: "icon_svg", widget: "text"}]}

      - file: "src/content/pages/about.md"
        label: "About Page"
        name: "about"
        fields:
          - {label: "Hero Image", name: "hero_image", widget: "image"}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Content", name: "body", widget: "markdown"}

      - file: "src/content/pages/contact.md"
        label: "Contact Page"
        name: "contact"
        fields:
          - {label: "Email", name: "email", widget: "string"}
          - {label: "Phone", name: "phone", widget: "string", required: false}
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Content", name: "body", widget: "markdown"}
